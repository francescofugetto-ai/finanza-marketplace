<!--
═══════════════════════════════════════════════════════════════════════════════
 template-report.html — il documento di una valutazione DCF.
 Skill: valutazione-aziende-dcf. Motore: scripts/dcf_engine.py.

 COME SI USA
 -----------
 1. Si esegue `run_dcf` sui TRE scenari, `sensitivity` sullo scenario base e i
    quattro risolutori inversi sullo scenario base.
 2. Si copia questo file nella cartella del documento e si sostituisce
    INTERAMENTE l'oggetto `const D = {...}` in fondo con i valori ottenuti.
    Nessun numero si scrive a mano: si trascrivono quelli del motore.
 3. Si mette `esempio: false`. Il banner dei dati di esempio sparisce.
 4. Si sceglie `registro`: "interno" oppure "condiviso".

 IL PARAMETRO `registro` CAMBIA SOLO IL RENDERING, MAI IL CALCOLO
 ----------------------------------------------------------------
   interno    — fair value puntuale, ipotesi grezze, tutte e quattro le
                risposte del reverse DCF. Titolo: azienda e data.
   condiviso  — il fair value compare SOLO come intervallo dei tre scenari
                affiancati (§6) e mai come cifra isolata altrove; delle ipotesi
                restano le tre motivazioni, non i quindici campi; del reverse
                DCF restano le prime due risposte. Titolo: la frase del
                reverse DCF.
 Restano in ENTRAMBI i registri, e la loro assenza e' un difetto del documento:
 la matrice di sensibilita', tutti gli allarmi del motore, gli indicatori di
 falsificazione, il ponte voce per voce, la chiusura fissa.

 Per vedere l'altro rendering si cambia il campo `registro` e si ricarica: non
 esiste un interruttore nella pagina e non esiste un parametro nell'indirizzo,
 perche' il registro di un documento consegnato non deve poter essere cambiato
 da chi lo riceve.

 I CINQUE ALLARMI HANNO TRE STATI, NON DUE
 -----------------------------------------
 scattato · non scattato · **non valutabile**, cioe' il controllo non e' potuto
 girare perche' gli manca un dato (oggi: i campi opzionali `sbc` e `risk_free`).
 Il §9 elenca tutti e cinque i controlli con il loro stato, sempre. Un controllo
 che non ha potuto girare NON e' un controllo superato, e la frase «nessun
 allarme» si puo' scrivere solo se tutti e cinque sono girati davvero.
 La regola per esteso: references/06-verdetto-e-linguaggio.md §5-bis.

 ═══ SUI DATI DI ESEMPIO DI QUESTO FILE — AVVISO CHE NON SPARISCE MAI ═══
 Il banner rosso in cima al documento sparisce con `esempio: false`, ma i numeri
 restano scritti qui sotto finche' non li si sostituisce. Quindi, una volta per
 tutte:

   L'episodio 337 di The Bull pubblica i TRE RISULTATI — 3,93 · 14,14 · 36,27
   dollari per azione — ma NON le ipotesi che li generano.

 Solo lo scenario BASE e' ricostruito dalle ipotesi vere, quelle della prova di
 riferimento in scripts/test_dcf_engine.py. Gli scenari PRUDENTE e FAVOREVOLE
 hanno ipotesi **mie**, cercate col motore finche' non ha riprodotto i due esiti
 pubblicati; il favorevole esce a 36,28 contro il 36,27 pubblicato, ed e' la
 prova che non sono le ipotesi originali. Anche `risk_free` 4,30% e il campo
 `sbc` lasciato vuoto sono scelte di comodo per far vedere il rendering.

 QUESTI NUMERI NON SI COPIANO ALTROVE. Non in una reference, non nel canone
 The Bull, e non si citano mai come «ipotesi di The Bull»: sono dati di prova
 di un template, e fuori di qui non hanno nessuna autorita'.

 DIPENDENZE: il font Inter e Chart.js, entrambi da CDN. Nient'altro. Il design
 system (variabili CSS, .stat-row, .cmp, i box con bordo sinistro, i 840px di
 larghezza) e' quello dei report esistenti del sistema, ripreso identico.

 DIVIETI DI LINGUAGGIO: references/06-verdetto-e-linguaggio.md §3 — nessun voto,
 nessun obiettivo di prezzo, nessuna etichetta secca, nessun orizzonte
 temporale, e la distanza dal prezzo si scrive «il prezzo sta N volte sopra lo
 scenario base», mai come percentuale di rialzo o di ribasso.
═══════════════════════════════════════════════════════════════════════════════
-->

                                                   scenario base» — mai una percentuale */

        <tr><td class="metric">NOPAT</td>${y.map(r => `<td class="num">${mln(r.nopat)}</td>`).join("")}</tr>
        <tr><td class="metric">− Reinvestimento</td>${y.map(r => `<td class="num">${mln(r.reinv)}</td>`).join("")}</tr>
        <tr><td class="metric">FCFF</td>${y.map(r => `<td class="num">${mln(r.fcff)}</td>`).join("")}</tr>
        <tr><td class="metric">Fattore di sconto</td>${y.map(r => `<td class="num">${nf(r.df, 4)}</td>`).join("")}</tr>
        <tr class="highlight"><td class="metric">Valore attuale del FCFF</td>${y.map(r => `<td class="num">${mln(r.pv)}</td>`).join("")}</tr>
      </tbody></table></div>
    <div class="chart-wrap">
      <div class="chart-title">FCFF nominale e valore attuale, scenario base</div>
      <div class="chart-sub">Flussi di fine anno, scontati a periodi interi al ${pc(BASE.ipotesi.wacc, 1)} · importi in ${D.meta.unita}</div>
      <div class="chart-canvas-wrap"><canvas id="flussiChart"></canvas></div>
    </div>
    ${y[0].fcff < 0 ? `<div class="box-warn"><strong>Il primo anno e' in cassa negativa.</strong>
       ${mln(y[0].fcff)} milioni: la crescita del ${pc(BASE.ipotesi.growth[0], 0)} chiede piu' capitale di quanto
       l'operativo ne produca. Non e' un errore del modello, e' il prezzo della crescita del primo anno.</div>` : ""}`;

  new Chart(el("flussiChart"), {
    type: "bar",
    data: {
      labels: y.map(r => r.anno),
      datasets: [
        { label: "FCFF nominale", data: y.map(r => r.fcff), backgroundColor: "#2A78D6", borderRadius: 4 },
        { label: "Valore attuale", data: y.map(r => r.pv), backgroundColor: "#534AB7", borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { font: { size: 11 }, color: "#52514E" } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#898781", font: { size: 11 } } },
        y: { grid: { color: "#E1E0D9" }, ticks: { color: "#898781", font: { size: 11 } },
             title: { display: true, text: D.meta.unita, color: "#898781", font: { size: 11 } } }
      }
    }
  });

  /* ── 5 · dal valore d'impresa al valore per azione: la cascata del ponte ── */
  const B = BASE.bridge;
  const scala = Math.max(...B.map(r => Math.abs(r.importo))) || 1;
  const righePonte = B.map((r, i) => {
    const primo = i === 0;
    const larghezza = Math.abs(r.importo) / scala * 100;
    const colore = primo ? "#2A78D6" : (r.importo > 0 ? "#3B6D11" : "#A32D2D");
    const barra = r.importo === 0
      ? `<div class="wf-zero" title="voce dichiarata a zero"></div>`
      : `<div class="wf-fill" style="width:${Math.max(6, larghezza)}%;background:${colore}">${mln(r.importo)}</div>`;
    return `<div class="wf-row${primo ? " wf-tot" : ""}">
        <div class="wf-lbl">${r.voce}</div>
        <div class="wf-track">${barra}</div>
        <div class="wf-amt">${mln(r.importo)}</div>
        <div class="wf-cum">${mln(r.cumulato)}</div>
      </div>`;
  }).join("");

  const chiusuraPonte = INT
    ? `<div class="wf-row wf-tot">
         <div class="wf-lbl">÷ ${mln(D.azioni_diluite)} mln azioni diluite</div>
         <div class="wf-track"><div class="wf-fill" style="width:100%;background:#534AB7">fair value per azione</div></div>
         <div class="wf-amt">—</div><div class="wf-cum">${den(BASE.fv)}</div>
       </div>`
    : `<div class="wf-row wf-tot">
         <div class="wf-lbl">÷ ${mln(D.azioni_diluite)} mln azioni diluite</div>
         <div class="wf-track"><div class="wf-fill" style="width:100%;background:#898781">l'esito per azione e' al §6, come intervallo dei tre scenari</div></div>
         <div class="wf-amt">—</div><div class="wf-cum">§6</div>
       </div>`;

  el("s5").innerHTML = `
    <p>L'Enterprise Value e' il valore dell'attivita' operativa. Quello che resta all'azionista si
       ottiene togliendo chi ha una pretesa prima di lui. Le voci a zero restano nella cascata:
       una riga a zero dichiarata vale piu' di una riga assente, che non si sa se sia zero o dimenticata.</p>
    <div class="stat-row">
      <div class="stat"><div class="stat-lbl">Valore attuale dei flussi espliciti</div><div class="stat-val">${mln(BASE.pv_explicit)}</div><div class="stat-note">i cinque anni del §4</div></div>
      <div class="stat"><div class="stat-lbl">Valore terminale attualizzato</div><div class="stat-val">${mln(BASE.pv_tv)}</div><div class="stat-note">${pc(BASE.quota_tv, 1)} dell'Enterprise Value</div></div>
      <div class="stat"><div class="stat-lbl">Enterprise Value</div><div class="stat-val">${mln(BASE.ev)}</div><div class="stat-note">prima del ponte</div></div>
      <div class="stat"><div class="stat-lbl">Equity value</div><div class="stat-val">${mln(BASE.eq)}</div><div class="stat-note">dopo il ponte</div></div>
    </div>
    <div class="waterfall">
      <div class="wf-head"><div class="wf-lbl">Voce</div><div style="flex:1"></div><div class="wf-amt">Importo</div><div class="wf-cum">Cumulato</div></div>
      ${righePonte}
      ${chiusuraPonte}
    </div>
    <p class="legenda">${D.ponte_note}</p>`;

  /* ── 6 · i tre scenari ──────────────────────────────────────────────────── */
  const posizione = v => {
    const lo = Math.min(FV_MIN, PREZZO), hi = Math.max(FV_MAX, PREZZO);
    return hi === lo ? 50 : (v - lo) / (hi - lo) * 100;
  };
  /* l'etichetta si allinea al tick, ma ai due estremi si appoggia al bordo:
     centrata uscirebbe dal riquadro. */
  const ancora = p => p <= 10 ? "left:0"
                    : p >= 90 ? "right:0"
                    : "left:50%;transform:translateX(-50%)";
  const tick = (p, cls, testo) =>
    `<div class="range-tick${cls}" style="left:${p.toFixed(1)}%"><span style="${ancora(p)}">${testo}</span></div>`;
  const barraRange = `
    <div class="range-bar">
      ${ORD.map(s => tick(posizione(s.fv), "", `${s.nome} ${den(s.fv)}`)).join("")}
      ${tick(posizione(PREZZO), " tick-prezzo", `prezzo ${den(PREZZO)}`)}
    </div>`;

  const cardScenari = ORD.map(s => `
    <div class="scen ${s.classe}">
      <div class="scen-nome">${s.nome}</div>
      <div class="scen-val">${den(s.fv)}</div>
      <div class="scen-txt">
        WACC ${pc(s.ipotesi.wacc, 1)} · g ${pc(s.ipotesi.g, 1)} · ROIC ${pc(s.ipotesi.roic, 0)}<br>
        valore terminale ${pc(s.quota_tv, 1)} dell'EV
        ${s.alarms.length ? `<br><span class="pill pill-red">${s.alarms.join(" · ")}</span>` : ""}
      </div>
    </div>`).join("");

  el("s6").innerHTML = `
    <div class="range">
      <div class="stat-lbl">Intervallo del fair value per azione, i tre scenari affiancati</div>
      <div class="range-val">${den(FV_MIN)} – ${den(FV_MAX)} ${D.meta.valuta}</div>
      ${barraRange}
      <p style="margin:0;font-size:13px;color:var(--text-secondary)">Fra il minimo e il massimo c'e' un fattore
        ${den(FV_MAX / FV_MIN)}, con ipotesi tutte difendibili. <strong>Quel fattore e' il risultato</strong>:
        dice che il valore di questa azienda non e' governato da cio' che ha fatto, ma da cio' che si crede fara'.
        Rispetto a questo intervallo, ${distanza}.</p>
    </div>
    <div class="scen-grid">${cardScenari}</div>
    ${COND ? `<p class="legenda">Il fair value compare qui, e solo qui, come intervallo con i tre scenari
       affiancati: un numero singolo, estratto da questo documento, verrebbe letto come un obiettivo di prezzo
       qualunque avvertenza lo accompagni.</p>` : ""}`;

  /* ── 7 · sensibilita' ───────────────────────────────────────────────────── */
  const SS = D.sensibilita;
  const righeSens = SS.wacc.map((w, i) => `
    <tr>
      <th class="rowhead">WACC ${pc(w, 1)}</th>
      ${SS.g.map((g, j) => {
        const v = SS.celle[i][j];
        const base = i === SS.riga_base && j === SS.colonna_base;
        if (v === null || v === undefined)
          return `<td class="num cell-nulla" title="wacc non supera g: qui non esiste un numero">—</td>`;
        return `<td class="num${base ? " cell-base" : ""}">${den(v)}</td>`;
      }).join("")}
    </tr>`).join("");

  const cellaMin = Math.min(...SS.celle.flat().filter(v => v !== null));
  const cellaMax = Math.max(...SS.celle.flat().filter(v => v !== null));

  el("s7").innerHTML = `
    <p>Il fair value per azione ricalcolato da capo in ogni cella: cambiando il costo del capitale cambiano
       anche i valori attuali dei cinque anni, e cambiando la crescita perpetua cambia il fattore
       (1 − g/ROIC). Ipotesi operative <strong>identiche</strong> in tutte e ${SS.wacc.length * SS.g.length} le celle.</p>
    <div class="cmp-table-wrap"><table class="cmp">
      <thead><tr><th>WACC \\ g perpetua</th>${SS.g.map(g => `<th class="num">${pc(g, 1)}</th>`).join("")}</tr></thead>
      <tbody>${righeSens}</tbody>
    </table></div>
    <p class="legenda">Cella evidenziata: lo scenario base. Le celle vuote sono combinazioni in cui il costo del
       capitale non supera la crescita perpetua: li' non esiste un numero, e non se ne scrive uno.</p>
    <div class="box-purple"><strong>Come si legge, in tre modi.</strong>
      L'<strong>ampiezza</strong>: da ${den(cellaMin)} a ${den(cellaMax)} a ipotesi operative identiche.
      <strong>Dove cade il prezzo</strong>: ${den(PREZZO)} sta ${PREZZO > cellaMax ? "fuori dalla matrice, sopra ogni cella" : PREZZO < cellaMin ? "fuori dalla matrice, sotto ogni cella" : "dentro la matrice"}.
      La <strong>pendenza lungo le righe</strong>: e' il costo del capitale a muovere il risultato piu' di ogni altra ipotesi.</div>`;

  /* ── 8 · reverse DCF ────────────────────────────────────────────────────── */
  const quante = COND ? 2 : D.reverse.length;
  const righeRev = D.reverse.slice(0, quante).map(r => `
    <tr>
      <td class="metric">${r.variabile}<div style="font-weight:400;color:var(--text-muted);font-size:11.5px">${r.domanda}</div></td>
      <td class="num">${r.modello}</td>
      <td class="num">${r.valore === null ? `<span class="pill pill-amber">nessuna soluzione</span>` : `<strong>${den(r.valore)}</strong> ${r.unita}`}</td>
    </tr>
    <tr><td colspan="3" style="color:var(--text-secondary)">${r.valore === null ? `<em>Il motore dice:</em> ${r.motivo}<br>` : ""}${r.lettura}</td></tr>`).join("");

  el("s8").innerHTML = `
    <p>Lo stesso modello letto al contrario: il prezzo si prende come dato e si cerca quale ipotesi lo
       renderebbe corretto. Non chiede di credere a niente — dice che cosa bisogna credere per giustificare
       il prezzo che si vede.</p>
    <div class="cmp-table-wrap"><table class="cmp">
      <thead><tr><th>Variabile</th><th class="num">Ipotesi del modello</th><th class="num">Valore che giustifica ${den(PREZZO)}</th></tr></thead>
      <tbody>${righeRev}</tbody>
    </table></div>
    ${COND ? `<p class="legenda">Delle quattro risposte del reverse DCF se ne portano due: le altre restano nel
       registro interno, per non consegnare quattro numeri che sembrano quattro conferme indipendenti.</p>` : ""}
    <div class="box-accent"><strong>Quattro letture della stessa distanza.</strong> ${D.reverse_avvertenza}
      E nessuna delle quattro contiene un tempo: il reverse DCF non dice quando, e non puo'.</div>`;

  /* ── 9 · allarmi ────────────────────────────────────────────────────────── */
  const pillStato = s => s === "emesso" ? `<span class="pill pill-red">emesso</span>`
                     : s === "non valutabile" ? `<span class="pill pill-amber">non valutabile</span>`
                     : `<span class="pill pill-gray">non emesso</span>`;
  const emessi = D.allarmi.filter(a => a.stato === "emesso");
  const nonValutabili = D.allarmi.filter(a => a.stato === "non valutabile");

  el("s9").innerHTML = `
    <p>Tutti e ${D.allarmi.length} i controlli del motore, con il loro stato. Gli allarmi sono dati, non
       eccezioni: il calcolo prosegue e il documento li mostra tutti, compresi quelli scomodi. Gli stati
       sono tre — <strong>emesso</strong>, <strong>non emesso</strong> e <strong>non valutabile</strong>,
       che vuol dire che al controllo manca un dato e non e' potuto girare. Il terzo non e' una sfumatura
       del secondo.</p>
    <div class="cmp-table-wrap"><table class="cmp">
      <thead><tr><th>Controllo</th><th>Stato</th><th>Dove</th></tr></thead>
      <tbody>${D.allarmi.map(a => `
        <tr class="${a.stato === "emesso" ? "highlight" : ""}"><td class="metric">${a.sigla}</td><td>${pillStato(a.stato)}</td><td>${a.dove}</td></tr>
        <tr><td colspan="3" style="color:var(--text-secondary)">${a.testo}</td></tr>`).join("")}
      </tbody></table></div>
    ${emessi.length
        ? emessi.map(a => `<div class="box-danger"><strong>${a.sigla}.</strong> ${a.testo}</div>`).join("")
        : nonValutabili.length
          /* «nessun allarme» si puo' scrivere solo se tutti e cinque sono girati davvero */
          ? `<div class="box-success"><strong>Nessuno dei controlli che hanno potuto girare ha superato la propria soglia.</strong> ${nonValutabili.length} su ${D.allarmi.length} non hanno potuto girare: si veda il riquadro qui sotto.</div>`
          : `<div class="box-success"><strong>Nessun allarme.</strong> Tutti e ${D.allarmi.length} i controlli sono girati e nessuno ha superato la propria soglia.</div>`}
    ${nonValutabili.length ? `<div class="box-warn"><strong>Un controllo che non ha potuto girare non e' un controllo superato.</strong>
       ${nonValutabili.map(a => a.sigla).join(", ")}: ${nonValutabili.map(a => a.testo).join(" ")}</div>` : ""}`;

  /* ── 10 · cosa guardare d'ora in poi ────────────────────────────────────── */
  el("s10").innerHTML = `
    <p>I ${D.indicatori.length} indicatori che falsificherebbero le ipotesi, con la soglia. Un verdetto senza
       indicatori di falsificazione e' una posizione, non un'analisi: fra sei mesi non ci sarebbe modo di sapere
       se reggeva.</p>
    <div class="cmp-table-wrap"><table class="cmp">
      <thead><tr><th>Indicatore</th><th>Soglia</th></tr></thead>
      <tbody>${D.indicatori.map(i => `
        <tr><td class="metric">${i.cosa}</td><td>${i.soglia}</td></tr>
        <tr><td colspan="2" style="color:var(--text-secondary)">${i.perche}</td></tr>`).join("")}
      </tbody></table></div>
    <div class="box-warn"><strong>Quando questo documento va riaperto.</strong> Al superamento di una delle soglie
      qui sopra, oppure alla scadenza delle ipotesi registrata nel registro. Riaprirlo significa scrivere prima
      che cosa e' cambiato e perche', poi le ipotesi nuove: e' l'append-only applicato al pensiero.</div>`;

  /* ── 11 · glossario ─────────────────────────────────────────────────────── */
  el("s11").innerHTML = `
    <div class="assumptions"><h3>Ogni termine tecnico di questo documento, in una riga</h3>
      <dl>${D.glossario.map(g => `<dt>${g.t}</dt><dd>${g.d}</dd>`).join("")}</dl>
    </div>`;

  /* ── chiusura fissa ─────────────────────────────────────────────────────── */
  el("chiusura").innerHTML = `
    ${D.chiusura_metodo} Prezzo in modalita' ${D.meta.modalita}, ripreso il ${D.prezzo.data} alle ${D.prezzo.ora} e non conservato per confronti successivi. Documento reso nel registro <strong>${D.registro}</strong>.
    <br><br>
    Contenuto informativo e di metodo, <strong>non consulenza finanziaria personalizzata</strong> ai sensi di legge
    ne' raccomandazione di investimento. Non contiene voti, obiettivi di prezzo, orizzonti temporali ne' indicazioni
    su pesi, ingressi o uscite. Un fair value e' l'esito delle ipotesi dichiarate: cambiando quelle, cambia.
    Investire comporta il rischio di perdere capitale.`;
})();
</script>
</body>
</html>
